version: 2

sources:
  - name: ibge
    database: wiki_mulher
    schema: raw
    tables:
      - name: raw_ibge_populacao_favelas


models:
  - name: rfn_ibge_populacao_favelas
    description: "
      Tabela de população feminina residente em favelas e comunidades
      urbanas brasileiras, segundo o Censo Demográfico 2022 do IBGE.
      Apresenta o total de mulheres e a distribuição da população
      feminina por faixas etárias quinquenais, desde 0 a 4 anos
      até 100 anos ou mais, por código geográfico do IBGE.
      Os dados permitem analisar a estrutura etária da população
      feminina residente nesses territórios."

    columns:
      - name: cod_ibge
        description: "Código geográfico do IBGE que identifica a unidade territorial de referência dos dados."

      - name: mulheres_total
        description: "População feminina total residente na unidade territorial,
          considerando todas as faixas etárias."

      - name: mulheres_0_4_anos
        description: "Número de meninas residentes com 0 a 4 anos de idade."

      - name: mulheres_5_9_anos
        description: "Número de meninas residentes com 5 a 9 anos de idade."

      - name: mulheres_10_14_anos
        description: "Número de meninas residentes com 10 a 14 anos de idade."

      - name: mulheres_15_19_anos
        description: "Número de mulheres residentes com 15 a 19 anos de idade."

      - name: mulheres_20_24_anos
        description: "Número de mulheres residentes com 20 a 24 anos de idade."

      - name: mulheres_25_29_anos
        description: "Número de mulheres residentes com 25 a 29 anos de idade."

      - name: mulheres_30_34_anos
        description: "Número de mulheres residentes com 30 a 34 anos de idade."

      - name: mulheres_35_39_anos
        description: "Número de mulheres residentes com 35 a 39 anos de idade."

      - name: mulheres_40_44_anos
        description: "Número de mulheres residentes com 40 a 44 anos de idade."

      - name: mulheres_45_49_anos
        description: "Número de mulheres residentes com 45 a 49 anos de idade."

      - name: mulheres_50_54_anos
        description: "Número de mulheres residentes com 50 a 54 anos de idade."

      - name: mulheres_55_59_anos
        description: "Número de mulheres residentes com 55 a 59 anos de idade."

      - name: mulheres_60_64_anos
        description: "Número de mulheres residentes com 60 a 64 anos de idade."

      - name: mulheres_65_69_anos
        description: "Número de mulheres residentes com 65 a 69 anos de idade."

      - name: mulheres_70_74_anos

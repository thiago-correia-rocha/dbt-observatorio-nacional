      - name: col_outro_destino
        description: "Quantidade de domicílios com outras formas de destinação do lixo."

      # Esgotamento sanitário
      - name: esg_total
        description: "Total de domicílios considerados nos indicadores de esgotamento sanitário."
      - name: esg_rede_geral
        description: "Quantidade de domicílios com esgotamento sanitário por rede geral."

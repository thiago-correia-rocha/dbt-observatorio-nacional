        description: "Indicador percentual de esgotamento sanitário disponibilizado pela fonte original."
      - name: esg_ranking
        description: "Posição no ranking de esgotamento sanitário definido pela fonte original."

      # Abastecimento de água
      - name: abas_total
        description: "Total de domicílios considerados nos indicadores de abastecimento de água."

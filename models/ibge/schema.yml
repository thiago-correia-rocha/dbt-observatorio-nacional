      - name: cod
        description: "Código da comunidade urbana no Ibge"
        data_tests:
          - not_null
          - unique
      - name: favela_completa
        description: "Nome da comunidade urbana com Unidade Federativa e Municipio"
      - name: favela
        description: "Nome da comunidade urbana sem Unidade Federativa e Municipio"
      - name: sigla
        description: "Sigla da Unidade Federativa"
      - name: municipio
        description: "Nome do Municipio tal como registrado no Ibge"
      - name: domicilios
        description: "Quantidade total de domicílios por comunidade urbana"
      - name: refresh_dt
        description: "Data e hora de atualização do modelo."
        data_tests:
        - not_null


  - name: dim_demo_local
    description: "Dimensão geográfica dos municípios brasileiros, construída a partir
      dos dados do IBGE. Contém o código identificador do município,
      a sigla da Unidade da Federação (UF) e o nome do município.
      Considera exclusivamente os registos classificados com nível
      territorial 'MU' (Município).
      Permite relacionar os dados populacionais com a sua localização
      geográfica e realizar análises por município e UF."
    columns:
      - name: cod_ibge
        description: "Código geográfico oficial do IBGE que identifica o município
          brasileiro. Utilizado como chave de relacionamento com as
          tabelas populacionais."
        data_tests:
          - not_null
          - unique
      - name: uf
        description: "Sigla de duas letras da Unidade da Federação (UF) à qual
          pertence o município. Exemplo: SP, RJ, MG ou DF."
        data_tests:
          - not_null
      - name: municipio
        description: "Nome oficial do município brasileiro, conforme a
          classificação geográfica do IBGE."
        data_tests:
          - not_null


  - name: aug_demo_main
    description: "Indicadores demográficos por município e faixa etária, integrando população, favelas e alfabetização do IBGE."
    columns:
      - name: cod_ibge
        description: "Código IBGE do município."
        data_tests:
          - not_null
      - name: faixa_etaria
        description: "Faixa etária ou total agregado."
        data_tests:
          - not_null
      - name: pop_total
        description: "População total."
      - name: pop_fav
        description: "População residente em favelas."
      - name: pop_fav_perc
        description: "Proporção da população residente em favelas."
      - name: pop_alfa
        description: "População alfabetizada."
      - name: pop_alfa_perc
        description: "Proporção da população alfabetizada."
      - name: homens_pop
        description: "População masculina."
      - name: homens_pop_fav
        description: "Homens residentes em favelas."
      - name: homens_pop_total_fav_perct
        description: "Proporção de homens residentes em favelas face à população masculina. Rever cálculo SQL."
      - name: homens_pop_fav_perct
        description: "Proporção masculina definida no staging de favelas."
      - name: homens_alfa
        description: "Homens alfabetizados."
      - name: homens_alfa_perct
        description: "Proporção de homens alfabetizados. Rever cálculo SQL."
      - name: mulheres_pop
        description: "População feminina."
      - name: mulheres_pop_fav

    description: "Modelo consolidado de indicadores de habitação e saneamento básico do Censo Demográfico 2022 do IBGE, abrangendo coleta de lixo, esgotamento sanitário, abastecimento de água, banheiros e quantidade de favelas por unidade federativa."

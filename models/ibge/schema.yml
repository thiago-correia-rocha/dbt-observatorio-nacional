  - name: rfn_demo_hab_esg
    description: "Dados do Censo Demográfico 2022 do IBGE sobre esgotamento sanitário dos domicílios brasileiros, incluindo formas de escoamento e instalações sanitárias."
    columns:
      - name: cod_ibge
        description: "Código geográfico do IBGE."
      - name: cep
        description: "Identificador geográfico presente na fonte original."
      - name: sigla
        description: "Sigla territorial presente na fonte original."
      - name: total
        description: "Total de domicílios no recorte analisado."
      - name: rede_geral
        description: "Domicílios com esgotamento por rede geral."
      - name: fossa_septica
        description: "Domicílios com esgotamento por fossa séptica."
      - name: fossa_rudimentar_buraco
        description: "Domicílios com esgotamento por fossa rudimentar ou buraco."
      - name: vala
        description: "Domicílios com esgotamento por vala."
      - name: rio_lago_corrego_mar
        description: "Domicílios com esgotamento em rio, lago, córrego ou mar."
      - name: outra_forma
        description: "Domicílios com outra forma de esgotamento sanitário."
      - name: sem_banheiro
        description: "Domicílios sem banheiro ou sanitário."
      - name: esgoto_perct
        description: "Indicador percentual de esgotamento sanitário, conforme definição da fonte."
      - name: ranking
        description: "Posição no ranking definido pela fonte original."
      - name: refresh_dt
        description: "Data e hora de atualização do modelo."
        data_tests:
        - not_null


  - name: rfn_demo_hab_abas
    description: "Dados do Censo Demográfico 2022 do IBGE sobre as formas de abastecimento de água nos domicílios brasileiros, incluindo rede geral, poços, nascentes, carros-pipa, água da chuva e outras fontes."
    columns:
      - name: cod_ibge
        description: "Código geográfico do IBGE."
      - name: cep
        description: "Identificador geográfico presente na fonte original."
      - name: nivel
        description: "Nível de agregação geográfica. BR - Brasil, UF - Unidade Federativa,MU - Município"
      - name: sigla
        description: "Sigla territorial presente na fonte original."
      - name: existencia
        description: "Classificação de existência utilizada pela fonte original para caracterizar os domicílios."
      - name: total
        description: "Total de domicílios no recorte analisado."
      - name: rede_geral
        description: "Quantidade de domicílios abastecidos pela rede geral de distribuição de água."
      - name: poco_artesiano
        description: "Quantidade de domicílios abastecidos por poço profundo ou artesiano."
      - name: poco_raso
        description: "Quantidade de domicílios abastecidos por poço raso."
      - name: fonte_nascente
        description: "Quantidade de domicílios abastecidos por fonte ou nascente."
      - name: carro_pipa
        description: "Quantidade de domicílios abastecidos por carro-pipa."
      - name: agua_chuva
        description: "Quantidade de domicílios que utilizam água da chuva como fonte de abastecimento."
      - name: rios_acudes
        description: "Quantidade de domicílios abastecidos por rios, açudes ou outras fontes superficiais de água."
      - name: outra
        description: "Quantidade de domicílios com outras formas de abastecimento de água."
      - name: abastecimento
        description: "Indicador percentual de abastecimento de água disponibilizado pela fonte original, cuja unidade e metodologia devem ser confirmadas."
      - name: ranking
        description: "Valor do ranking de abastecimento de água definido pela fonte original."

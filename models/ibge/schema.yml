  - name: dim_ibge_loc
    description: "Dimensão geográfica dos municípios brasileiros, construída a partir
      dos dados do IBGE. Contém o código identificador do município,
      a sigla da Unidade da Federação (UF) e o nome do município.
      Considera exclusivamente os registos classificados com nível
      territorial 'MU' (Município).
      Permite relacionar os dados populacionais com a sua localização
      geográfica e realizar análises por município e UF."

    columns:
      - name: cod_ibge
        description: "Código geográfico oficial do IBGE que identifica o município
          brasileiro. Utilizado como chave de relacionamento com as
          tabelas populacionais."
        data_tests:
          - not_null
          - unique

      - name: uf
        description: "Sigla de duas letras da Unidade da Federação (UF) à qual
          pertence o município. Exemplo: SP, RJ, MG ou DF."
        data_tests:
          - not_null

      - name: municipio
        description: "Nome oficial do município brasileiro, conforme a
          classificação geográfica do IBGE."
        data_tests:
          - not_null

  - name: rfn_ibge_pop
    description: "Tabela de população do IBGE, utilizada como base para análises
      demográficas e territoriais do projeto Wiki Mulher.
      Disponibiliza dados populacionais tratados na camada REFINED,
      permitindo a integração com a dimensão geográfica dos municípios
      e a construção de indicadores demográficos.
      A granularidade e os indicadores específicos dependem dos
      campos presentes no modelo SQL."

    columns:
      - name: cod_ibge
        description: "Código geográfico do IBGE associado ao registo populacional.
          Permite relacionar os dados com as unidades territoriais
          correspondentes."
        data_tests:
          - not_null
          - unique

      - name: mulheres_total
        description: "Número total de mulheres residentes na unidade territorial,
          considerando todas as faixas etárias."

